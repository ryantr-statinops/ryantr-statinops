name: 3D Contribution Calendar

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/contribution-3d.yml
      - conf/github-profile-3d-contrib.json
      - scripts/calendar-only.py

permissions:
  contents: write

concurrency:
  group: contribution-3d-${{ github.ref }}
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate cyan contribution chart
        # Pin the renderer because calendar-only.py relies on its SVG structure.
        uses: yoshi389111/github-profile-3d-contrib@e235d118909be71eb7edb05482a3de4e76156df3
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN || github.token }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json
      - name: Keep only the 3D calendar
        run: python scripts/calendar-only.py profile-3d-contrib/profile-cyan.svg assets/contribution-3d.svg
      - name: Commit updated calendar
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-3d.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update 3D contribution calendar [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
